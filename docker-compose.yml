services:
  # Everything except the MT5 sync: demo, show, tests (and later the API).
  app:
    build:
      context: .
      args:
        UID: ${UID:-1000}
    # Only the language model settings come in from .env (the MT5 password does not).
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-}
    volumes:
      - ./data:/data

  # The web page and API (make web): http://localhost:8000, reachable from this computer only.
  web:
    build:
      context: .
      args:
        UID: ${UID:-1000}
    command: ["serve"]
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-}
      # Daily AI budget (0 = no limit) and answer style: auto = templates for simple answers, ai = always the model
      TQ_DAILY_REQUESTS: ${TQ_DAILY_REQUESTS:-300}
      TQ_DAILY_TOKENS: ${TQ_DAILY_TOKENS:-1000000}
      TQ_EXPLAIN: ${TQ_EXPLAIN:-auto}
      TQ_ALLOWED_HOSTS: ${TQ_ALLOWED_HOSTS:-}
    volumes:
      - ./data:/data
    restart: unless-stopped

  # MetaTrader 5 + Windows Python under Wine. Only used to download history.
  mt5:
    build:
      context: .
      dockerfile: docker/mt5/Dockerfile
      args:
        UID: ${UID:-1000}
    platform: linux/amd64
    env_file:
      - path: .env
        required: false
    volumes:
      - ./data:/data
      - mt5-wine:/home/trader/.wine

  # The page's "Sync now": the same Wine image, waiting for /data/sync/request.
  # make web starts it when MT5 is set up. SYNC_EVERY_MINUTES in .env also syncs on a timer.
  sync-worker:
    build:
      context: .
      dockerfile: docker/mt5/Dockerfile
      args:
        UID: ${UID:-1000}
    platform: linux/amd64
    command: ["worker"]
    env_file:
      - path: .env
        required: false
    volumes:
      - ./data:/data
      - mt5-wine:/home/trader/.wine
    restart: unless-stopped

volumes:
  mt5-wine:
