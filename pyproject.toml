[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tradequery"
version = "0.2.0"
description = "Ask plain-English questions about your MT5 trade history and get verified answers."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    # Windows (and so Wine) has no system timezone database; zoneinfo needs this there.
    "tzdata; sys_platform == 'win32'",
    # MT5 library: only installable on Windows Python, so only inside the Wine image.
    "MetaTrader5; sys_platform == 'win32'",
    # MetaTrader5 needs numpy, and numpy 2.x crashes under Wine 10
    # ("unimplemented function ucrtbase.dll.crealf"). 1.26 works.
    "numpy<2; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
# The question layer (QuerySpec validation and the SQL compiler). Not needed by the MT5 sync.
query = ["pydantic>=2.7", "SQLAlchemy>=2.0"]
# The language model provider (Gemini, Google's official SDK). Imported only when asking questions.
llm = ["google-genai>=1.0"]

[project.scripts]
tradequery = "tradequery.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tradequery = ["settings.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
