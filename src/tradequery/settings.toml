# TradeQuery settings. Thresholds and rules live here so they can be tuned
# without code changes. Nothing secret goes in this file; credentials belong in
# the git-ignored .env file or the OS keyring.

[time]
# How the broker's server clock relates to UTC.
#   "ny_close": New York time + 7h (UTC+2 winter, UTC+3 summer). Most forex brokers.
#   "fixed":    a constant offset, set fixed_offset_hours below.
# Verify with one known event (a past NFP release) for each broker.
server_clock = "ny_close"
fixed_offset_hours = 2

# Zone used for "local time" in answers.
local_timezone = "Asia/Damascus"

[metrics]
# A trade whose net profit is within this amount (account currency) of zero is
# break-even: not a win, not a loss, and ignored by streaks by default.
break_even_tolerance = 0.0
# Streaks of wins or losses: false = a break-even trade is skipped (the streak
# goes on through it); true = a break-even trade ends the streak.
breakeven_breaks_streak = false

[sessions]
# Trading sessions as [start, end) hours in UTC. A trade is labeled with every
# session that contains its open hour, joined in this order (for example
# "london_new_york"), or "off_hours" when none does.
asia = [0, 8]
london = [7, 16]
new_york = [12, 21]

[detectors]
# Starting thresholds from the build plan; calibrate them on real data.
# A trade with a non-zero magic number is treated as automated (an EA), and the
# behavioural rules (revenge, overtrading) only run on manual trades.

# revenge_trade: opened within this many minutes of a losing close ...
revenge_window_minutes = 15
# ... with lots at least this multiple of the median lots of the previous trades
revenge_lot_multiplier = 1.5
revenge_median_lookback = 20

# overtrading: trades after the day's count passes mean + N standard deviations
# of the daily counts over the previous trading days in this many calendar days
overtrading_lookback_days = 30
overtrading_sd_multiplier = 2.0

# oversized: lots per 1,000 of balance above this multiple of the account median
oversized_multiplier = 2.0

# trades (revenge) or trading days (overtrading) needed before judging at all
min_history = 5

# magic numbers to treat as manual trades although they are not 0
manual_magics = []
