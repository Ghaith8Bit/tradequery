<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TradeQuery</title>
<style>
  :root {
    --bg: #f7f7f8; --panel: #ffffff; --side: #f0f1f4; --text: #1c2230; --muted: #667085; --line: #e3e6eb;
    --accent: #2f6bff; --accent-soft: #e9efff; --user: #2f6bff; --user-text: #ffffff;
    --good: #16794a; --good-soft: #e3f4ea; --warn: #9a5800; --warn-soft: #fdf1dc; --bad: #c0362c; --bad-soft: #fde8e6;
    --code: #f2f4f7; --shadow: 0 1px 2px rgba(16, 24, 40, .06), 0 1px 3px rgba(16, 24, 40, .08);
    --pos: #2f6bff; --neg: #e5484d; --grid: #e7eaf0;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111318; --panel: #1a1d24; --side: #15181e; --text: #e7e9ee; --muted: #9aa3b2; --line: #2a2f39;
      --accent: #7ea2ff; --accent-soft: #1f2940; --user: #3a63d8; --user-text: #ffffff;
      --good: #5fd08f; --good-soft: #15301f; --warn: #f2b45e; --warn-soft: #33260f; --bad: #ff8a80; --bad-soft: #3a1c1a;
      --code: #222630; --shadow: none; --pos: #7ea2ff; --neg: #ff6b6b; --grid: #262b35;
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  button, select, textarea { font: inherit; color: inherit; }
  .app { display: flex; height: 100dvh; }

  /* sidebar */
  aside { width: 280px; flex: none; background: var(--side); border-right: 1px solid var(--line);
          display: flex; flex-direction: column; padding: 14px; gap: 12px; }
  .brand { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 17px; }
  .brand .logo { width: 28px; height: 28px; border-radius: 8px; background: var(--accent); color: #fff;
                 display: grid; place-items: center; font-size: 15px; }
  label.small { font-size: 12px; color: var(--muted); margin-bottom: -6px; }
  select { width: 100%; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; }
  .new-chat { display: flex; align-items: center; gap: 8px; justify-content: center; border: 1px solid var(--line);
              background: var(--panel); border-radius: 10px; padding: 9px; cursor: pointer; font-weight: 600; }
  .new-chat:hover { border-color: var(--accent); color: var(--accent); }
  .history-title { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; margin-top: 4px; }
  .history { flex: 1; overflow: auto; display: flex; flex-direction: column; gap: 2px; margin: 0 -6px; }
  .history button { text-align: left; border: 0; background: none; padding: 8px 10px; border-radius: 8px; cursor: pointer;
                    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .history button:hover { background: var(--panel); }
  .history button.active { background: var(--accent-soft); color: var(--accent); }
  .history .empty { color: var(--muted); font-size: 13px; padding: 4px 10px; }
  .model { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex: none; }
  .dot.ok { background: var(--good); } .dot.warn { background: var(--warn); }

  /* main */
  main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .topbar { display: none; align-items: center; gap: 10px; padding: 10px 14px; border-bottom: 1px solid var(--line);
            background: var(--panel); }
  .icon-btn { border: 0; background: none; padding: 6px; border-radius: 8px; cursor: pointer; line-height: 0; }
  .icon-btn:hover { background: var(--code); }
  .topbar .title { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chat { flex: 1; overflow: auto; padding: 24px 16px 8px; }
  .inner { max-width: 860px; margin: 0 auto; }

  /* overview */
  .hello { font-size: 24px; font-weight: 700; margin: 4px 0 2px; }
  .sub { color: var(--muted); margin: 0 0 16px; }
  .tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
  .tile { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; box-shadow: var(--shadow); }
  .tile .k { font-size: 12px; color: var(--muted); }
  .tile .v { font-size: 21px; font-weight: 700; margin-top: 2px; font-variant-numeric: tabular-nums; }
  .tile .s { font-size: 12px; color: var(--muted); }
  .v.neg { color: var(--neg); } .v.pos { color: var(--good); }
  .charts { display: grid; grid-template-columns: 3fr 2fr; gap: 10px; margin-top: 10px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; box-shadow: var(--shadow); }
  .card h3 { margin: 0 0 6px; font-size: 13px; font-weight: 600; color: var(--muted); }
  .facts { list-style: none; margin: 10px 0 0; padding: 0; display: grid; gap: 6px; }
  .facts li { border-radius: 10px; padding: 8px 12px; font-size: 14px; background: var(--code); }
  .facts li.warn { background: var(--warn-soft); color: var(--warn); }
  .suggest-title { margin: 20px 0 8px; font-weight: 600; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 7px 13px;
          cursor: pointer; font-size: 13.5px; text-align: left; }
  .chip:hover { border-color: var(--accent); color: var(--accent); }

  /* messages */
  .msg { display: flex; margin: 16px 0; gap: 10px; }
  .msg.user { justify-content: flex-end; }
  .bubble { max-width: 85%; border-radius: 16px; padding: 10px 14px; }
  .msg.user .bubble { background: var(--user); color: var(--user-text); border-bottom-right-radius: 6px; }
  .msg.bot .avatar { width: 30px; height: 30px; flex: none; border-radius: 9px; background: var(--accent); color: #fff;
                     display: grid; place-items: center; font-size: 14px; font-weight: 700; margin-top: 2px; }
  .msg.bot .bubble { background: var(--panel); border: 1px solid var(--line); box-shadow: var(--shadow);
                     border-top-left-radius: 6px; width: 100%; max-width: 100%; min-width: 0; }
  .answer-text { font-size: 15.5px; }
  .badge { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; border-radius: 999px;
           padding: 2px 9px; margin-bottom: 6px; }
  .badge.ok { background: var(--good-soft); color: var(--good); }
  .badge.warn { background: var(--warn-soft); color: var(--warn); }
  .badge.info { background: var(--code); color: var(--muted); }
  .note { font-size: 13px; color: var(--warn); margin-top: 6px; }
  .error { color: var(--bad); background: var(--bad-soft); border-radius: 10px; padding: 8px 12px; margin-top: 4px; }
  .chart { margin-top: 10px; }
  .chart svg { width: 100%; height: auto; display: block; }
  .table-wrap { overflow: auto; border: 1px solid var(--line); border-radius: 10px; margin-top: 10px; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; font-variant-numeric: tabular-nums; }
  th, td { padding: 6px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th { background: var(--code); text-align: left; font-weight: 600; text-transform: capitalize; }
  tr:last-child td { border-bottom: 0; }
  td.num { text-align: right; } td.neg { color: var(--neg); }
  .more-btn { border: 0; background: none; color: var(--accent); cursor: pointer; padding: 6px 0 0; font-size: 13px; }
  details.details { margin-top: 10px; font-size: 13px; }
  details.details summary { cursor: pointer; color: var(--muted); }
  .interp { color: var(--muted); border-left: 3px solid var(--accent-soft); padding-left: 8px; margin: 8px 0; }
  pre { background: var(--code); border-radius: 8px; padding: 10px; overflow: auto; font-size: 12px; white-space: pre-wrap;
        word-break: break-word; margin: 6px 0; }
  .usage { font-size: 12px; color: var(--muted); margin-top: 6px; }
  .typing { display: inline-flex; gap: 4px; padding: 6px 2px; }
  .typing span { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); animation: blink 1.2s infinite; }
  .typing span:nth-child(2) { animation-delay: .2s; } .typing span:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }

  /* composer */
  .composer { padding: 10px 16px calc(14px + env(safe-area-inset-bottom)); background: linear-gradient(transparent, var(--bg) 30%); }
  .composer .box { max-width: 860px; margin: 0 auto; display: flex; align-items: flex-end; gap: 8px; background: var(--panel);
                   border: 1px solid var(--line); border-radius: 16px; padding: 8px 8px 8px 14px; box-shadow: var(--shadow); }
  .composer .box:focus-within { border-color: var(--accent); }
  textarea { flex: 1; border: 0; outline: 0; resize: none; background: transparent; max-height: 160px; padding: 6px 0; }
  .send { border: 0; background: var(--accent); color: #fff; width: 38px; height: 38px; border-radius: 11px; cursor: pointer;
          display: grid; place-items: center; flex: none; }
  .send:disabled { opacity: .45; cursor: default; }
  .hint { max-width: 860px; margin: 6px auto 0; font-size: 12px; color: var(--muted); text-align: center; }
  .backdrop { display: none; }

  /* account freshness, sync and upload */
  .acct-meta { font-size: 12px; color: var(--muted); margin-top: -4px; min-height: 16px; }
  .acct-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .acct-actions button { border: 1px solid var(--line); background: var(--panel); border-radius: 10px; padding: 7px 6px;
                         cursor: pointer; font-size: 13px; display: flex; align-items: center; justify-content: center; gap: 6px; }
  .acct-actions button:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  .acct-actions button:disabled { opacity: .5; cursor: default; }
  .spin { width: 12px; height: 12px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%;
          animation: spin .8s linear infinite; flex: none; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .toast { position: fixed; z-index: 40; left: 50%; bottom: 96px; transform: translateX(-50%); max-width: min(560px, calc(100vw - 32px));
           background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-size: 14px; box-shadow: 0 6px 24px rgba(0,0,0,.25); }
  .toast.bad { background: var(--bad); color: #fff; }
  .drop { position: fixed; inset: 0; z-index: 50; background: rgba(47, 107, 255, .12); border: 3px dashed var(--accent);
          display: grid; place-items: center; font-size: 20px; font-weight: 700; color: var(--accent); pointer-events: none; }

  /* clickable ids in answer tables */
  .id-link { border: 0; background: none; color: var(--accent); cursor: pointer; padding: 0; font: inherit;
             text-decoration: underline; text-underline-offset: 2px; }

  /* the chart window */
  .modal { position: fixed; inset: 0; z-index: 30; background: rgba(0, 0, 0, .45); display: grid; place-items: center; padding: 16px; }
  .sheet { background: var(--panel); border-radius: 16px; width: min(940px, 100%); max-height: calc(100dvh - 32px); overflow: auto;
           box-shadow: 0 10px 40px rgba(0, 0, 0, .3); }
  .sheet header { position: sticky; top: 0; background: var(--panel); display: flex; align-items: center; gap: 10px;
                  padding: 12px 16px; border-bottom: 1px solid var(--line); z-index: 1; }
  .sheet header .t { flex: 1; font-weight: 700; }
  .sheet .content { padding: 12px 16px 16px; }
  .legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 12px; color: var(--muted); margin: 4px 0 8px; }
  .legend span { display: inline-flex; align-items: center; gap: 5px; }
  .kv { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; margin-top: 10px; }
  .kv div { background: var(--code); border-radius: 10px; padding: 7px 10px; font-size: 13px; }
  .kv b { display: block; font-size: 11px; color: var(--muted); font-weight: 500; }
  .tile.link { cursor: pointer; } .tile.link:hover { border-color: var(--accent); }

  /* phones and small tablets */
  @media (max-width: 820px) {
    aside { position: fixed; z-index: 20; top: 0; bottom: 0; left: 0; transform: translateX(-100%); transition: transform .2s;
            box-shadow: 0 0 30px rgba(0, 0, 0, .25); }
    aside.open { transform: none; }
    .backdrop.open { display: block; position: fixed; inset: 0; background: rgba(0, 0, 0, .35); z-index: 10; }
    .topbar { display: flex; }
    .chat { padding: 16px 12px 8px; }
    .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .charts { grid-template-columns: 1fr; }
    .bubble { max-width: 92%; }
    .msg.bot .avatar { display: none; }
    .hello { font-size: 20px; }
    .composer { padding-left: 10px; padding-right: 10px; }
    .modal { padding: 0; place-items: stretch; }
    .sheet { border-radius: 0; max-height: 100dvh; height: 100dvh; width: 100%; }
    .kv { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }
</style>
</head>
<body>
<div class="app">
  <aside id="sidebar" aria-label="Conversations">
    <div class="brand"><span class="logo">TQ</span> TradeQuery</div>
    <label class="small" for="account">Account</label>
    <select id="account"></select>
    <div class="acct-meta" id="updated"></div>
    <div class="acct-actions">
      <button type="button" id="syncBtn" title="Download new trades from MT5">Sync now</button>
      <button type="button" id="uploadBtn" title="Add an MT5 history report (.html)">Upload report</button>
    </div>
    <input type="file" id="fileInput" accept=".html,.htm,text/html" hidden>
    <button class="new-chat" id="newChat" type="button">+ New chat</button>
    <div class="history-title">Chats</div>
    <div class="history" id="history"></div>
    <div class="model"><span class="dot" id="modelDot"></span><span id="modelText">checking the AI model…</span></div>
  </aside>
  <div class="backdrop" id="backdrop"></div>

  <main>
    <div class="topbar">
      <button class="icon-btn" id="menu" type="button" aria-label="Open the menu">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
      <div class="title" id="topTitle">TradeQuery</div>
    </div>
    <div class="chat" id="chat"><div class="inner" id="thread"></div></div>
    <form class="composer" id="form" autocomplete="off">
      <div class="box">
        <textarea id="question" rows="1" maxlength="500" placeholder="Ask about your trading…" aria-label="Your question"></textarea>
        <button class="send" id="send" type="submit" aria-label="Send" disabled>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        </button>
      </div>
      <div class="hint" id="hint">Every number in an answer is checked against your data. Follow-ups refine your last question.</div>
    </form>
  </main>
</div>
<div class="modal" id="modal" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <header>
      <div class="t" id="modalTitle"></div>
      <button class="icon-btn" id="modalClose" type="button" aria-label="Close">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </header>
    <div class="content" id="modalBody"></div>
  </div>
</div>
<div class="toast" id="toast" hidden></div>
<div class="drop" id="drop" hidden>Drop your MT5 report to add it</div>

<script>
const $ = (id) => document.getElementById(id);
const SVG = "http://www.w3.org/2000/svg";
const state = { login: null, accounts: [], presets: [], overview: null, chats: [], chatId: null, busy: false, modelReady: false };

/* ---------- small helpers (data always goes in as text, never as HTML) ---------- */
function el(tag, attrs = {}, text) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) node.setAttribute(k, v);
  if (text !== undefined && text !== null) node.textContent = text;
  return node;
}
function svg(tag, attrs = {}, text) {
  const node = document.createElementNS(SVG, tag);
  for (const [k, v] of Object.entries(attrs)) node.setAttribute(k, v);
  if (text !== undefined) node.textContent = text;
  return node;
}
async function api(path, body) {
  const opts = body ? { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) } : {};
  const res = await fetch(path, opts);
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(typeof data.detail === "string" ? data.detail : `Request failed (${res.status})`);
  return data;
}
const fmt2 = new Intl.NumberFormat(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const fmt0 = new Intl.NumberFormat(undefined, { maximumFractionDigits: 0 });
function money(v) { return v === null || v === undefined ? "–" : fmt2.format(v); }
function pct(v) { return v === null || v === undefined ? "–" : (v * 100).toFixed(1) + "%"; }
function cell(col, v, shares) {
  if (v === null || v === undefined) return "–";
  if (typeof v === "number") {
    if (shares.includes(col)) return (v * 100).toFixed(2) + "%";
    if (/lot/.test(col) && !/multiplier/.test(col)) return v.toFixed(2);
    if (Number.isInteger(v)) return String(v);
    return Math.abs(v) < 1 ? v.toFixed(4) : fmt2.format(v);
  }
  return String(v);
}
const label = (c) => c.replaceAll("_", " ");
const store = {
  key: (login) => `tq.chats.${login}`,
  load(login) { try { return JSON.parse(localStorage.getItem(this.key(login)) || "[]"); } catch { return []; } },
  save(login, chats) { try { localStorage.setItem(this.key(login), JSON.stringify(chats.slice(0, 40))); } catch {} },
};

/* ---------- charts (inline SVG, no libraries) ---------- */
function barChart(labels, values, { asPercent = false } = {}) {
  const W = 640, H = 230, padL = 56, padB = 34, padT = 12, padR = 8;
  const max = Math.max(0, ...values), min = Math.min(0, ...values);
  const span = max - min || 1;
  const y = (v) => padT + (max - v) / span * (H - padT - padB);
  const slot = (W - padL - padR) / values.length;
  const bw = Math.min(46, slot * 0.66);
  const root = svg("svg", { viewBox: `0 0 ${W} ${H}`, role: "img" });
  [max, (max + min) / 2, min].forEach((t) => {
    root.appendChild(svg("line", { x1: padL, x2: W - padR, y1: y(t), y2: y(t), stroke: "var(--grid)" }));
    root.appendChild(svg("text", { x: padL - 6, y: y(t) + 4, "text-anchor": "end", "font-size": 11, fill: "var(--muted)" },
      asPercent ? (t * 100).toFixed(0) + "%" : fmt0.format(t)));
  });
  root.appendChild(svg("line", { x1: padL, x2: W - padR, y1: y(0), y2: y(0), stroke: "var(--muted)", "stroke-width": 1 }));
  values.forEach((v, i) => {
    const x = padL + slot * i + (slot - bw) / 2;
    const top = Math.min(y(v), y(0)), h = Math.max(1, Math.abs(y(v) - y(0)));
    const bar = svg("rect", { x, y: top, width: bw, height: h, rx: 4, fill: v < 0 ? "var(--neg)" : "var(--pos)" });
    bar.appendChild(svg("title", {}, `${labels[i]}: ${asPercent ? (v * 100).toFixed(2) + "%" : fmt2.format(v)}`));
    root.appendChild(bar);
    const every = Math.ceil(values.length / 14);
    if (i % every === 0) root.appendChild(svg("text", { x: x + bw / 2, y: H - padB + 16, "text-anchor": "middle",
      "font-size": 11, fill: "var(--muted)" }, String(labels[i]).slice(0, 10)));
  });
  return root;
}
function lineChart(points) {
  const W = 640, H = 230, padL = 60, padB = 30, padT = 12, padR = 10;
  const vals = points.map((p) => p[1]);
  const max = Math.max(...vals), min = Math.min(...vals), span = max - min || 1;
  const x = (i) => padL + i / Math.max(1, points.length - 1) * (W - padL - padR);
  const y = (v) => padT + (max - v) / span * (H - padT - padB);
  const root = svg("svg", { viewBox: `0 0 ${W} ${H}`, role: "img" });
  [max, (max + min) / 2, min].forEach((t) => {
    root.appendChild(svg("line", { x1: padL, x2: W - padR, y1: y(t), y2: y(t), stroke: "var(--grid)" }));
    root.appendChild(svg("text", { x: padL - 6, y: y(t) + 4, "text-anchor": "end", "font-size": 11, fill: "var(--muted)" }, fmt0.format(t)));
  });
  const d = points.map((p, i) => `${i ? "L" : "M"}${x(i).toFixed(1)},${y(p[1]).toFixed(1)}`).join(" ");
  root.appendChild(svg("path", { d: `${d} L${x(points.length - 1)},${H - padB} L${x(0)},${H - padB} Z`, fill: "var(--accent-soft)" }));
  root.appendChild(svg("path", { d, fill: "none", stroke: "var(--pos)", "stroke-width": 2, "stroke-linejoin": "round" }));
  const day = (s) => String(s).slice(0, 10);
  root.appendChild(svg("text", { x: padL, y: H - 8, "font-size": 11, fill: "var(--muted)" }, day(points[0][0])));
  root.appendChild(svg("text", { x: W - padR, y: H - 8, "text-anchor": "end", "font-size": 11, fill: "var(--muted)" },
    day(points[points.length - 1][0])));
  return root;
}
/* A chart for an answer when its shape suits one: a category column and a number column. */
function autoChart(result) {
  const { columns, rows } = result;
  if (rows.length < 2 || rows.length > 40) return null;
  const numeric = (i) => rows.every((r) => r[i] === null || typeof r[i] === "number");
  const catIdx = columns.findIndex((c, i) => !numeric(i) || /^(hour|magic|weekday|month|depth|set|type|side|symbol)/.test(c));
  if (catIdx < 0) return null;
  const valIdx = columns.findIndex((c, i) => i !== catIdx && numeric(i) && !/(_id|_low|_high)$/.test(c) && c !== "trades");
  if (valIdx < 0) return null;
  if (columns[catIdx].endsWith("_utc")) {
    return rows.length >= 6 ? lineChart(rows.map((r) => [r[catIdx], r[valIdx]])) : null;
  }
  const asPercent = result.share_columns.includes(columns[valIdx]);
  const DAYS = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];
  const ordered = rows.every((r) => DAYS.includes(String(r[catIdx]).slice(0, 3)))
    ? [...rows].sort((a, b) => DAYS.indexOf(String(a[catIdx]).slice(0, 3)) - DAYS.indexOf(String(b[catIdx]).slice(0, 3)))
    : rows;
  const chart = barChart(ordered.map((r) => r[catIdx]), ordered.map((r) => r[valIdx] || 0), { asPercent });
  const wrap = el("div", { class: "chart" });
  wrap.appendChild(el("div", { class: "usage" }, `${label(columns[valIdx])} by ${label(columns[catIdx])}`));
  wrap.appendChild(chart);
  return wrap;
}

/* ---------- price chart for a trade or a sequence ---------- */
const toMs = (s) => Date.parse(String(s).slice(0, 19).replace(" ", "T") + "Z");
const shortTime = (s) => String(s).slice(5, 16);  // MM-DD HH:MM
const REASONS = { sl: "stop loss", tp: "take profit", so: "stop-out", client: "closed by hand", mobile: "closed by hand (phone)",
                  web: "closed by hand (web)", expert: "closed by the EA", "": "–" };
function priceDigits(p) { return p < 10 ? 5 : p < 1000 ? 3 : 2; }

function candleChart(data) {
  const W = 900, H = 380, padL = 66, padR = 46, padT = 14, padB = 30;
  // Candles sit side by side, skipping hours without prices (weekends), as trading
  // platforms do; a fill is placed on the candle whose time span holds it.
  const C = data.candles, n = C.length;
  const step = data.minutes_per_candle * 60000, times = C.map((c) => toMs(c[0]));
  const slot = (W - padL - padR) / n;
  const xAt = (ms) => {
    let lo = 0, hi = n - 1;
    while (lo < hi) { const mid = (lo + hi + 1) >> 1; if (times[mid] <= ms) lo = mid; else hi = mid - 1; }
    const frac = Math.min(1, Math.max(0, (ms - times[lo]) / step));
    return padL + (lo + frac) * slot;
  };
  let lo = Math.min(...C.map((c) => c[3]), ...data.markers.map((m) => m.price));
  let hi = Math.max(...C.map((c) => c[2]), ...data.markers.map((m) => m.price));
  const span0 = hi - lo || hi * 0.001 || 1;
  const shown = [], offChart = [];
  data.lines.forEach((l) => (l.price >= lo - span0 * 0.6 && l.price <= hi + span0 * 0.6 ? shown : offChart).push(l));
  shown.forEach((l) => { lo = Math.min(lo, l.price); hi = Math.max(hi, l.price); });
  const pad = (hi - lo || span0) * 0.06; lo -= pad; hi += pad;
  const y = (p) => padT + (hi - p) / (hi - lo) * (H - padT - padB);
  const digits = priceDigits(hi);
  const root = svg("svg", { viewBox: `0 0 ${W} ${H}`, role: "img" });
  for (let i = 0; i <= 4; i++) {
    const p = lo + (hi - lo) * i / 4;
    root.appendChild(svg("line", { x1: padL, x2: W - padR, y1: y(p), y2: y(p), stroke: "var(--grid)" }));
    root.appendChild(svg("text", { x: padL - 6, y: y(p) + 4, "text-anchor": "end", "font-size": 11, fill: "var(--muted)" }, p.toFixed(digits)));
  }
  [0, Math.floor((n - 1) / 2), n - 1].forEach((i, k) => root.appendChild(svg("text", {
    x: padL + (i + 0.5) * slot, y: H - 10, "text-anchor": k === 0 ? "start" : k === 2 ? "end" : "middle",
    "font-size": 11, fill: "var(--muted)" }, shortTime(C[i][0]))));
  // a dotted line where hours without prices were skipped
  for (let i = 1; i < n; i++) {
    if (times[i] - times[i - 1] > Math.max(step * 6, 3600000)) {
      const x = padL + i * slot;
      root.appendChild(svg("line", { x1: x, x2: x, y1: padT, y2: H - padB, stroke: "var(--muted)", "stroke-dasharray": "2 4", opacity: 0.6 }));
      const g = svg("text", { x: x + 3, y: padT + 10, "font-size": 10, fill: "var(--muted)" },
        `${Math.round((times[i] - times[i - 1]) / 3600000)} h without prices`);
      root.appendChild(g);
    }
  }
  const bw = Math.max(1, slot * 0.62);
  C.forEach(([t, o, h, l, c], i) => {
    const x = padL + (i + 0.5) * slot, color = c >= o ? "var(--good)" : "var(--neg)";
    const g = svg("g", { opacity: 0.55 });
    g.appendChild(svg("line", { x1: x, x2: x, y1: y(h), y2: y(l), stroke: color }));
    g.appendChild(svg("rect", { x: x - bw / 2, y: y(Math.max(o, c)), width: bw, height: Math.max(1, Math.abs(y(o) - y(c))), fill: color }));
    g.appendChild(svg("title", {}, `${t} UTC  O ${o} H ${h} L ${l} C ${c}`));
    root.appendChild(g);
  });
  shown.forEach((l) => {
    root.appendChild(svg("line", { x1: padL, x2: W - padR, y1: y(l.price), y2: y(l.price), stroke: l.label === "SL" ? "var(--neg)" : "var(--good)",
      "stroke-dasharray": "6 4", "stroke-width": 1.5 }));
    root.appendChild(svg("text", { x: W - padR + 4, y: y(l.price) + 4, "font-size": 11, fill: "var(--muted)" }, l.label));
  });
  const byPos = {};
  data.markers.forEach((m) => { (byPos[m.position_id] = byPos[m.position_id] || {})[m.kind] = m; });
  const many = Object.keys(byPos).length;
  Object.values(byPos).forEach(({ entry, exit }) => {
    if (!entry || !exit) return;
    root.appendChild(svg("line", { x1: xAt(toMs(entry.time)), y1: y(entry.price), x2: xAt(toMs(exit.time)), y2: y(exit.price),
      stroke: "var(--muted)", "stroke-dasharray": "3 3", "stroke-width": 1 }));
  });
  data.markers.forEach((m) => {
    const x = xAt(toMs(m.time)), py = y(m.price);
    let shape;
    if (m.kind === "entry") {
      const up = m.side === "buy", s = 7;
      shape = svg("path", { d: up ? `M${x},${py - s} L${x + s},${py + s} L${x - s},${py + s} Z` : `M${x},${py + s} L${x + s},${py - s} L${x - s},${py - s} Z`,
        fill: up ? "var(--accent)" : "var(--warn)", stroke: "var(--panel)", "stroke-width": 1 });
      shape.appendChild(svg("title", {}, `Entry ${m.side} ${m.lots} lots at ${m.price} · ${m.time} UTC` + (many > 1 ? ` · level ${m.level}` : "")));
      if (many > 1 && many <= 16) root.appendChild(svg("text", { x: x - 9, y: py + 4, "text-anchor": "end", "font-size": 10, fill: "var(--muted)" }, String(m.level)));
    } else {
      shape = svg("circle", { cx: x, cy: py, r: 5, fill: (m.net || 0) >= 0 ? "var(--good)" : "var(--neg)", stroke: "var(--panel)", "stroke-width": 1.5 });
      shape.appendChild(svg("title", {}, `Exit at ${m.price} · ${m.time} UTC · net ${fmt2.format(m.net || 0)}`));
    }
    root.appendChild(shape);
  });
  return { node: root, offChart };
}

function kv(pairs) {
  const box = el("div", { class: "kv" });
  pairs.forEach(([k, v]) => { const d = el("div"); d.appendChild(el("b", {}, k)); d.appendChild(document.createTextNode(v)); box.appendChild(d); });
  return box;
}
function legend(data) {
  const box = el("div", { class: "legend" });
  const item = (shape, text) => { const s = el("span"); s.appendChild(shape); s.appendChild(document.createTextNode(text)); box.appendChild(s); };
  const icon = (d, fill) => { const s = svg("svg", { width: 12, height: 12, viewBox: "0 0 12 12" }); s.appendChild(svg("path", { d, fill })); return s; };
  item(icon("M6,1 L11,11 L1,11 Z", "var(--accent)"), "buy entry");
  item(icon("M6,11 L11,1 L1,1 Z", "var(--warn)"), "sell entry");
  item(icon("M6,1 a5,5 0 1,0 0.01,0 Z", "var(--good)"), "exit in profit");
  item(icon("M6,1 a5,5 0 1,0 0.01,0 Z", "var(--neg)"), "exit at a loss");
  box.appendChild(el("span", {}, `${data.symbol} · ${data.minutes_per_candle}-minute candles · UTC`));
  return box;
}
function chartBlock(data, body) {
  if (data.candles.length) {
    body.appendChild(legend(data));
    const { node, offChart } = candleChart(data);
    const wrap = el("div", { class: "chart" }); wrap.appendChild(node); body.appendChild(wrap);
    offChart.forEach((l) => body.appendChild(el("div", { class: "note" }, `${l.label} at ${l.price} is far outside this chart.`)));
  } else {
    body.appendChild(el("div", { class: "note" }, data.note));
  }
}
function hours(min) { return min >= 120 ? `${(min / 60).toFixed(1)} h` : `${Math.round(min)} min`; }

async function openChart(kind, id) {
  const modal = $("modal"), body = $("modalBody");
  $("modalTitle").textContent = kind === "trade" ? `Trade ${id}` : `Sequence ${id}`;
  body.replaceChildren(el("div", { class: "sub" }, "Loading the price chart…"));
  modal.hidden = false;
  $("modalClose").focus();
  let data;
  try {
    data = await api(kind === "trade" ? `/api/trade?login=${state.login}&position_id=${id}` : `/api/sequence?login=${state.login}&sequence_id=${id}`);
  } catch (error) {
    body.replaceChildren(el("div", { class: "error" }, error.message));
    return;
  }
  body.replaceChildren();
  if (kind === "trade") {
    const t = data.trade;
    $("modalTitle").textContent = `Trade ${t.position_id} · ${t.symbol} ${t.side} ${t.lots} lots`;
    chartBlock(data, body);
    body.appendChild(kv([
      ["Opened (UTC)", `${t.open_time_utc.slice(0, 16)} at ${t.open_price}`],
      ["Closed (UTC)", `${t.close_time_utc.slice(0, 16)} at ${t.close_price}`],
      ["Net result", `${money(t.net_profit)}`], ["Held", hours(t.hold_minutes)],
      ["Closed by", REASONS[t.close_reason] || t.close_reason], ["Stop loss", t.sl ? String(t.sl) : "none"],
      ["Take profit", t.tp ? String(t.tp) : "none"], ["Outcome", t.outcome || "–"],
    ]));
    if (data.sequence_id) {
      const b = el("button", { class: "chip", type: "button", style: "margin-top:12px" }, `Show its whole sequence (${data.sequence_id})`);
      b.addEventListener("click", () => openChart("sequence", data.sequence_id));
      body.appendChild(b);
    }
  } else {
    const s = data.sequence;
    $("modalTitle").textContent = `Sequence ${s.sequence_id} · ${s.symbol} ${s.type.replace("_", " + ")} · ${s.depth} levels`;
    chartBlock(data, body);
    body.appendChild(kv([
      ["Side", s.side], ["Levels", String(s.depth)], ["Lots", `${s.first_lot} → ${s.max_lot} (${s.max_lot_multiplier}×)`],
      ["Most open at once", String(s.max_open)], ["Started (UTC)", s.start_utc.slice(0, 16)], ["Ended (UTC)", s.end_utc.slice(0, 16)],
      ["Net result", money(s.net_pnl)], ["Outcome", s.is_win ? "closed in profit" : "closed at a loss"],
    ]));
    const result = {
      columns: ["level", "position_id", "open_time_utc", "lots", "open_price", "close_price", "net_profit"],
      rows: data.trades.map((t, i) => [i + 1, t.position_id, t.open_time_utc.slice(0, 16), t.lots, t.open_price, t.close_price, t.net_profit]),
      share_columns: [],
    };
    body.appendChild(renderTable(result, result.rows.length));
  }
}
function closeChart() { $("modal").hidden = true; }
$("modalClose").addEventListener("click", closeChart);
$("modal").addEventListener("click", (e) => { if (e.target === $("modal")) closeChart(); });
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && !$("modal").hidden) closeChart(); });

/* ---------- overview (the start screen) ---------- */
function tile(k, v, s, cls = "") {
  const t = el("div", { class: "tile" });
  t.appendChild(el("div", { class: "k" }, k));
  t.appendChild(el("div", { class: "v " + cls }, v));
  if (s) t.appendChild(el("div", { class: "s" }, s));
  return t;
}
function renderOverview(container) {
  const o = state.overview;
  container.appendChild(el("div", { class: "hello" }, "What would you like to know?"));
  if (!o) { container.appendChild(el("p", { class: "sub" }, "Loading your account…")); return; }
  const span = o.first ? `${o.first.slice(0, 10)} to ${o.last.slice(0, 10)}` : "no trades yet";
  container.appendChild(el("p", { class: "sub" }, `Account ${o.login} · ${o.trades} trades · ${span}`));
  if (o.stats) {
    const s = o.stats, cur = o.currency;
    const tiles = el("div", { class: "tiles" });
    tiles.appendChild(tile("Net result", `${money(s.net_profit)} ${cur}`, "closed trades", s.net_profit < 0 ? "neg" : "pos"));
    tiles.appendChild(tile("Win rate", pct(s.win_rate), s.profit_factor ? `profit factor ${s.profit_factor.toFixed(2)}` : ""));
    tiles.appendChild(tile("Balance", `${money(o.balance)} ${cur}`, `deposits ${money(s.deposits)}`));
    tiles.appendChild(tile("Worst drawdown", `${money(s.max_drawdown)}`, pct(s.max_drawdown_pct) + " of the money at stake",
      s.max_drawdown_pct >= 0.5 ? "neg" : ""));
    const deep = s.deepest_sequence;
    const deepTile = tile("Deepest sequence", deep ? `${deep.depth} levels` : "none",
      deep ? `${deep.multiplier}× lots · net ${money(deep.net)} · tap for the chart` : "no martingale or grid",
      deep && deep.depth >= 6 ? "neg" : "");
    if (deep && deep.id) {
      deepTile.classList.add("link");
      deepTile.setAttribute("role", "button");
      deepTile.setAttribute("tabindex", "0");
      deepTile.addEventListener("click", () => openChart("sequence", deep.id));
      deepTile.addEventListener("keydown", (e) => { if (e.key === "Enter") openChart("sequence", deep.id); });
    }
    tiles.appendChild(deepTile);
    tiles.appendChild(tile("Trades", String(o.trades), `${s.withdrawals ? "withdrawn " + money(-s.withdrawals) : ""}`));
    container.appendChild(tiles);
    const charts = el("div", { class: "charts" });
    if (o.balance_curve.length > 1) {
      const c = el("div", { class: "card" });
      c.appendChild(el("h3", {}, "Balance after each closed trade"));
      c.appendChild(lineChart(o.balance_curve));
      charts.appendChild(c);
    }
    if (o.by_weekday.length) {
      const c = el("div", { class: "card" });
      c.appendChild(el("h3", {}, "Net result by weekday (server time)"));
      c.appendChild(barChart(o.by_weekday.map((d) => d[0]), o.by_weekday.map((d) => d[1])));
      charts.appendChild(c);
    }
    container.appendChild(charts);
    if (o.facts.length) {
      const list = el("ul", { class: "facts" });
      o.facts.forEach((f) => list.appendChild(el("li", { class: f.level }, f.text)));
      container.appendChild(list);
    }
  }
  container.appendChild(el("div", { class: "suggest-title" }, "Try asking"));
  const chips = el("div", { class: "chips" });
  state.presets.slice(0, 10).forEach((p) => {
    const chip = el("button", { class: "chip", type: "button" }, p.question);
    chip.addEventListener("click", () => askPreset(p));
    chips.appendChild(chip);
  });
  container.appendChild(chips);
}

/* ---------- messages ---------- */
function userMessage(text) {
  const m = el("div", { class: "msg user" });
  m.appendChild(el("div", { class: "bubble" }, text));
  return m;
}
function botShell() {
  const m = el("div", { class: "msg bot" });
  m.appendChild(el("div", { class: "avatar" }, "TQ"));
  const b = el("div", { class: "bubble" });
  m.appendChild(b);
  return [m, b];
}
function renderTable(result, limit) {
  const wrap = el("div", { class: "table-wrap" });
  const table = el("table");
  const head = el("tr");
  result.columns.forEach((c) => head.appendChild(el("th", {}, label(c))));
  table.appendChild(el("thead")).appendChild(head);
  const body = el("tbody");
  result.rows.slice(0, limit).forEach((row) => {
    const tr = el("tr");
    row.forEach((v, i) => {
      const num = typeof v === "number";
      const col = result.columns[i];
      const td = el("td", { class: (num ? "num" : "") + (num && v < 0 ? " neg" : "") });
      const kind = col === "position_id" ? "trade" : col === "sequence_id" ? "sequence" : null;
      if (kind && Number.isInteger(v)) {
        const link = el("button", { class: "id-link", type: "button", title: `Show this ${kind} on a price chart`,
          "aria-label": `${kind} ${v}: show on a price chart` }, String(v));
        link.addEventListener("click", () => openChart(kind, v));
        td.appendChild(link);
      } else {
        td.textContent = cell(col, v, result.share_columns);
      }
      tr.appendChild(td);
    });
    body.appendChild(tr);
  });
  table.appendChild(body);
  wrap.appendChild(table);
  return wrap;
}
function renderAnswer(bubble, data) {
  const r = data.result;
  if (data.kind === "clarify" || data.kind === "unsupported") {
    bubble.appendChild(el("span", { class: "badge info" }, data.kind === "clarify" ? "Needs a detail" : "Outside what I can answer"));
    bubble.appendChild(el("div", { class: "answer-text" }, data.text));
  } else if (data.text) {
    bubble.appendChild(el("span", { class: "badge ok" }, "✓ every number checked against your data"));
    bubble.appendChild(el("div", { class: "answer-text" }, data.text));
  } else if (r) {
    bubble.appendChild(el("span", { class: "badge " + (data.model ? "warn" : "info") },
      data.model ? "The written answer didn't pass the number check, so here is the data itself"
                 : "Example question: answered straight from your data"));
  }
  if (data.error) bubble.appendChild(el("div", { class: "error" }, data.error));
  if (r) {
    r.notes.forEach((n) => bubble.appendChild(el("div", { class: "note" }, n)));
    const chart = autoChart(r);
    if (chart) bubble.appendChild(chart);
    if (r.rows.length) {
      const LIMIT = 8;
      let wrap = renderTable(r, LIMIT);
      bubble.appendChild(wrap);
      if (r.rows.length > LIMIT) {
        const more = el("button", { class: "more-btn", type: "button" }, `Show all ${r.rows.length} rows`);
        more.addEventListener("click", () => { const full = renderTable(r, r.rows.length); wrap.replaceWith(full); wrap = full; more.remove(); });
        bubble.appendChild(more);
      }
    } else if (!data.text) {
      bubble.appendChild(el("div", { class: "answer-text" }, "Nothing matched."));
    }
    const details = el("details", { class: "details" });
    details.appendChild(el("summary", {}, "How this was found"));
    details.appendChild(el("div", { class: "interp" }, r.interpretation));
    if (data.spec) details.appendChild(el("pre", {}, JSON.stringify(data.spec, null, 2)));
    if (r.sql) details.appendChild(el("pre", {}, r.sql));
    details.appendChild(el("div", { class: "usage" }, data.model
      ? `${data.model} · ${data.usage.requests} requests · ${data.usage.input_tokens + data.usage.output_tokens} tokens`
      : "No AI call: a hand-written query"));
    bubble.appendChild(details);
  }
}

/* ---------- chats ---------- */
function currentChat() { return state.chats.find((c) => c.id === state.chatId) || null; }
function renderHistory() {
  const h = $("history");
  h.replaceChildren();
  if (!state.chats.length) { h.appendChild(el("div", { class: "empty" }, "Your chats will appear here.")); return; }
  state.chats.forEach((c) => {
    const b = el("button", { type: "button", class: c.id === state.chatId ? "active" : "", title: c.title }, c.title);
    b.addEventListener("click", () => { state.chatId = c.id; renderThread(); renderHistory(); closeMenu(); });
    h.appendChild(b);
  });
}
function renderThread() {
  const t = $("thread");
  t.replaceChildren();
  const chat = currentChat();
  if (!chat) { renderOverview(t); $("chat").scrollTop = 0; return; }
  chat.messages.forEach((m) => {
    if (m.role === "user") t.appendChild(userMessage(m.text));
    else { const [box, bubble] = botShell(); renderAnswer(bubble, m.data); t.appendChild(box); }
  });
  $("chat").scrollTop = $("chat").scrollHeight;
}
function ensureChat(firstQuestion) {
  let chat = currentChat();
  if (!chat) {
    chat = { id: String(Date.now()), title: firstQuestion.slice(0, 60), sessionId: null, messages: [] };
    state.chats.unshift(chat);
    state.chatId = chat.id;
  }
  return chat;
}
function trimForStorage(data) {
  if (!data.result || data.result.rows.length <= 100) return data;
  return { ...data, result: { ...data.result, rows: data.result.rows.slice(0, 100), truncated: true } };
}
async function send(question, request) {
  if (state.busy || !state.login) return;
  state.busy = true;
  updateSend();
  const chat = ensureChat(question);
  if (chat.messages.length === 0) renderThread();
  chat.messages.push({ role: "user", text: question });
  const t = $("thread");
  t.appendChild(userMessage(question));
  const [box, bubble] = botShell();
  const typing = el("div", { class: "typing" });
  typing.append(el("span"), el("span"), el("span"));
  bubble.appendChild(typing);
  t.appendChild(box);
  box.scrollIntoView({ behavior: "smooth", block: "end" });
  renderHistory();
  let data;
  try {
    data = await request(chat);
    if (data.session_id) chat.sessionId = data.session_id;
  } catch (error) {
    data = { error: error.message, result: null, text: null };
  }
  typing.remove();
  renderAnswer(bubble, data);
  chat.messages.push({ role: "bot", data: trimForStorage(data) });
  store.save(state.login, state.chats);
  box.scrollIntoView({ behavior: "smooth", block: "start" });
  state.busy = false;
  updateSend();
}
function askPreset(p) {
  send(p.question, () => api("/api/preset", { login: state.login, number: p.number }));
}

/* ---------- composer, menu, accounts ---------- */
const q = $("question");
function updateSend() { $("send").disabled = state.busy || !q.value.trim(); }
function autosize() { q.style.height = "auto"; q.style.height = Math.min(q.scrollHeight, 160) + "px"; }
q.addEventListener("input", () => { autosize(); updateSend(); });
q.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("form").requestSubmit(); }
});
$("form").addEventListener("submit", (e) => {
  e.preventDefault();
  const question = q.value.trim();
  if (!question || state.busy) return;
  if (!state.modelReady) {
    $("hint").textContent = "No AI model is set up (GEMINI_API_KEY in .env), so only the suggested questions work.";
    return;
  }
  q.value = ""; autosize(); updateSend();
  send(question, (chat) => api("/api/ask", { login: state.login, question, session_id: chat.sessionId }));
});
$("newChat").addEventListener("click", () => { state.chatId = null; renderThread(); renderHistory(); closeMenu(); q.focus(); });
function openMenu() { $("sidebar").classList.add("open"); $("backdrop").classList.add("open"); }
function closeMenu() { $("sidebar").classList.remove("open"); $("backdrop").classList.remove("open"); }
$("menu").addEventListener("click", openMenu);
$("backdrop").addEventListener("click", closeMenu);

async function loadOverview() {
  const login = state.login;
  try { state.overview = await api(`/api/overview?login=${login}`); }
  catch (error) { state.overview = { login, trades: 0, facts: [], balance_curve: [], by_weekday: [], stats: null, error: error.message }; }
  if (login === state.login && !currentChat()) renderThread();
}
async function selectAccount(login) {
  state.login = login;
  state.chats = store.load(login);
  state.chatId = null;
  state.overview = null;
  $("account").value = String(login);
  const acct = state.accounts.find((a) => a.login === login);
  $("topTitle").textContent = acct ? `${acct.login} · ${acct.currency || ""}` : "TradeQuery";
  renderHistory();
  renderThread();
  renderFreshness();
  await loadOverview();
}
$("account").addEventListener("change", () => { selectAccount(Number($("account").value)); closeMenu(); });

/* ---------- accounts, freshness, sync and upload ---------- */
function ago(utc) {
  const min = (Date.now() - toMs(utc)) / 60000;
  if (!isFinite(min)) return "";
  if (min < 1.5) return "just now";
  if (min < 90) return `${Math.round(min)} min ago`;
  if (min < 36 * 60) return `${Math.round(min / 60)} h ago`;
  return `${Math.round(min / 1440)} days ago`;
}
function renderFreshness() {
  const a = state.accounts.find((x) => x.login === state.login);
  const sample = a && a.server === "Synthetic";
  $("updated").textContent = !a ? "" : sample ? "Sample account with made-up trades"
    : `Updated ${a.synced_at ? ago(a.synced_at) : "–"}` + (a.last ? ` · newest trade ${a.last.slice(0, 10)}` : "");
  renderSyncButton();
}
function fillAccounts() {
  const select = $("account");
  select.replaceChildren();
  state.accounts.forEach((a) => {
    const span = a.first ? ` · ${a.first.slice(0, 10)} to ${a.last.slice(0, 10)}` : "";
    select.appendChild(el("option", { value: a.login }, `${a.login} · ${a.currency || ""} · ${a.trades} trades${span}`));
  });
  if (state.login) select.value = String(state.login);
}
async function refreshAccounts(selectLogin) {
  state.accounts = await api("/api/accounts");
  fillAccounts();
  if (selectLogin && selectLogin !== state.login) return selectAccount(selectLogin);
  if (!state.login && state.accounts.length) return selectAccount(state.accounts[0].login);
  renderFreshness();
  await loadOverview();
}
let toastTimer = null;
function toast(text, { bad = false, stay = false } = {}) {
  const t = $("toast");
  t.textContent = text;
  t.className = "toast" + (bad ? " bad" : "");
  t.hidden = false;
  clearTimeout(toastTimer);
  if (!stay) toastTimer = setTimeout(() => { t.hidden = true; }, bad ? 9000 : 5000);
}
function busyButton(button, text) {
  button.replaceChildren(el("span", { class: "spin" }), document.createTextNode(text));
  button.disabled = true;
}

/* Sync now: the MT5 sync worker does the download; the page asks for it and watches. */
state.sync = null;
state.syncSeen = undefined;  // the last finished time already reported
function renderSyncButton() {
  const b = $("syncBtn"), s = state.sync;
  const running = s && (s.state === "running" || s.requested);
  if (running) { busyButton(b, "Syncing…"); b.title = "Downloading new trades from MT5"; return; }
  b.replaceChildren(document.createTextNode("Sync now"));
  const mine = s && s.available && s.login === state.login;
  b.disabled = !mine;
  b.title = !s ? "Checking the MT5 sync…" : !s.available ? s.reason
    : s.login !== state.login ? `Sync works for account ${s.login}, the one in .env.` : "Download new trades from MT5";
}
async function pollSync() {
  let s;
  try { s = await api("/api/sync"); } catch { s = null; }
  const before = state.syncSeen;
  state.sync = s;
  if (s) {
    if (before !== undefined && s.finished && s.finished !== before && s.state !== "running") {
      if (s.state === "done") { toast("Sync finished: the latest trades are loaded."); refreshAccounts(); }
      else toast("The sync failed: " + (s.message || "see the sync worker's log."), { bad: true });
    }
    state.syncSeen = s.finished || null;
  }
  renderSyncButton();
  const running = s && (s.state === "running" || s.requested);
  setTimeout(pollSync, running ? 3000 : 20000);
}
$("syncBtn").addEventListener("click", async () => {
  try {
    state.sync = await api("/api/sync", {});
    renderSyncButton();
    toast("Syncing with MT5. This takes a minute or two; you can keep asking questions.");
  } catch (error) {
    toast(error.message, { bad: true });
  }
});

/* Upload report: the button, or a file dropped anywhere on the page. */
async function uploadReport(file) {
  if (!file) return;
  if (!/\.html?$/i.test(file.name)) { toast("Choose the MT5 history report: an .html file (Save as Report in MT5).", { bad: true }); return; }
  const b = $("uploadBtn");
  busyButton(b, "Reading…");
  toast(`Reading ${file.name}…`, { stay: true });
  try {
    const res = await fetch("/api/import", { method: "POST", headers: { "Content-Type": "application/octet-stream" }, body: file });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(typeof data.detail === "string" ? data.detail : `Upload failed (${res.status})`);
    toast(data.new_deals
      ? `Added to account ${data.login}: ${data.new_deals} new deals, ${data.trades} closed trades in total.`
      : `Account ${data.login} already had all ${data.deals} deals in this report; nothing new.`);
    await refreshAccounts(data.login);
  } catch (error) {
    toast(error.message, { bad: true });
  } finally {
    b.replaceChildren(document.createTextNode("Upload report"));
    b.disabled = false;
    $("fileInput").value = "";
  }
}
$("uploadBtn").addEventListener("click", () => $("fileInput").click());
$("fileInput").addEventListener("change", () => { uploadReport($("fileInput").files[0]); closeMenu(); });
let dragDepth = 0;
const hasFiles = (e) => e.dataTransfer && Array.from(e.dataTransfer.types || []).includes("Files");
window.addEventListener("dragenter", (e) => { if (!hasFiles(e)) return; e.preventDefault(); dragDepth++; $("drop").hidden = false; });
window.addEventListener("dragover", (e) => { if (hasFiles(e)) e.preventDefault(); });
window.addEventListener("dragleave", () => { dragDepth = Math.max(0, dragDepth - 1); if (!dragDepth) $("drop").hidden = true; });
window.addEventListener("drop", (e) => {
  if (!hasFiles(e)) return;
  e.preventDefault(); dragDepth = 0; $("drop").hidden = true;
  uploadReport(e.dataTransfer.files[0]);
});

async function start() {
  try {
    [state.accounts, state.presets] = await Promise.all([api("/api/accounts"), api("/api/presets")]);
  } catch (error) {
    $("thread").replaceChildren(el("div", { class: "error" }, "Could not reach TradeQuery: " + error.message));
    return;
  }
  pollSync();
  if (!state.accounts.length) {
    $("thread").replaceChildren(el("div", { class: "hello" }, "Add your first account"),
      el("p", { class: "sub" }, "Drop an MT5 history report (.html) anywhere on this page, or use Upload report. "
        + "In MT5: History tab, right-click, Report, HTML."));
  } else {
    fillAccounts();
    selectAccount(state.accounts[0].login);
  }
  try {
    const s = await api("/api/status");
    state.modelReady = s.ready;
    $("modelDot").className = "dot " + (s.ready ? "ok" : "warn");
    $("modelText").textContent = s.ready ? `AI: ${s.model}` : "No AI model: suggested questions only";
  } catch {
    $("modelText").textContent = "AI status unknown";
  }
  q.focus();
}
start();
</script>
